<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification"
          content="Yizc1RMxfuNdF0yAAt21340zduJU_2JuV_pNmiCk1H8">

    <meta name="description"
          content="CURIO.IO — INTERACTIVE EXPERIENCES ABOUT SCIENCE, PSYCHOLOGY, AND THE WEIRD THINGS AROUND US.">

    <title>Curio.io</title>

    <meta property="og:title" content="Curio.io">
    <meta property="og:description"
          content="EXPLORE WEIRD SITUATIONS AND DISCOVER THE SCIENCE BEHIND THEM.">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="site">

        <!-- WEBSITE BANNER -->

        <section class="hero">
            <div class="hero-image">
    <img src="banner.png" alt="">
</div>
            </div>

            <h1 class="logo">Curio.io</h1>

        </section>


        <!-- GAME 1 -->

        <section class="game-section">

            <h2>🧪 HOW WOULD YOU SURVIVE?</h2>

            <p class="subheading">MAKE A GOOD CHOICE...</p>

            <div class="game">

                <div class="scenario">

                    <div class="emoji">🌋</div>

                    <h3 id="survivalTitle">
                        A VOLCANO SUDDENLY ERUPTS!
                    </h3>

                    <p id="survivalDescription">
                        YOU HAVE 30 SECONDS TO DECIDE WHAT TO DO.
                    </p>

                </div>

                <div class="choices">

                    <button onclick="survive(1)">
                        🏃 RUN DOWNHILL
                    </button>

                    <button onclick="survive(2)">
                        ↔️ RUN SIDEWAYS
                    </button>

                    <button onclick="survive(3)">
                        📸 TAKE A SELFIE
                    </button>

                </div>


                <div id="result" class="result">

                    <h3 id="resultTitle"></h3>

                    <p id="resultText"></p>

                    <button onclick="nextScenario()">
                        ➡️ NEXT SCENARIO
                    </button>

                </div>

            </div>

        </section>


        <!-- GAME 2 -->

        <section class="game-section weird-section">

            <h2>🧠 WEIRD SITUATIONS</h2>

            <p class="subheading">
                HAVE YOU EXPERIENCED THESE?
            </p>


            <!-- PSYCHOLOGY BUTTONS -->

            <div class="psychology-buttons">

                <button onclick="showExperience(0)">
                    🚪 DOORWAY EFFECT
                </button>

                <button onclick="showExperience(1)">
                    🌀 DÉJÀ VU
                </button>

                <button onclick="showExperience(2)">
                    💭 TIP-OF-THE-TONGUE
                </button>

                <button onclick="showExperience(3)">
                    👀 FEELING OF BEING WATCHED
                </button>

            </div>


            <!-- PSYCHOLOGY RESULT -->

            <div id="psychologyResult" class="psychology-result">

                <h3 id="experienceTitle"></h3>

                <p id="experienceDescription"></p>

                <button
                    id="whyButton"
                    onclick="showWhy()">
                    WHY?
                </button>

                <div
                    id="theory"
                    class="theory">

                    <h4>THE PSYCHOLOGY</h4>

                    <p id="theoryText"></p>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
