<body>

    <div class="game">

        <h1>HOW LONG WOULD YOU SURVIVE?</h1>

        <div class="scenario">

            <div class="emoji">🌋</div>

            <h2>A VOLCANO SUDDENLY ERUPTS!</h2>

            <p>
                You have 30 seconds to decide what to do.
            </p>

        </div>


        <div class="choices">

            <button onclick="survive(1)">
                🏃 RUN DOWNHILL
            </button>

            <button onclick="survive(2)">
                ↔️ RUN SIDEWAYS
            </button>

            <button onclick="survive(3)">
                📸 TAKE A SELFIE
            </button>

        </div>


        <div id="result" class="result">

    <h2 id="resultTitle"></h2>

    <p id="resultText"></p>

    <button onclick="nextScenario()">
        ➡️ NEXT SCENARIO
    </button>

</div>

    </div>
